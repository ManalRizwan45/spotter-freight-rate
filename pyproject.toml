[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-rate"
version = "1.0.0"
description = "Freight rate prediction for the Spotter ML assessment"
readme = "README.md"
requires-python = ">=3.10"
# Pinned exactly, not ranged. Every figure quoted in README.md and in the module
# docstrings is a measurement, and scikit-learn's tree construction can change across
# minor releases: a range would let a fresh install report a different MAE than the one
# documented, with nothing to indicate why. These four are the versions the numbers were
# produced on. The assessment's own requirements.txt is left as supplied.
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
]

# Tooling stays ranged: it cannot change a result, only how results are checked.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.10",
]

[project.scripts]
freight-rate = "freight_rate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
